
name: ImpactGraph CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: impactgraph
          POSTGRES_PASSWORD: impactgraph_ci_password
          POSTGRES_DB: impactgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impactgraph -d impactgraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://impactgraph:impactgraph_ci_password@localhost:5432/impactgraph_test?sslmode=disable

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Verify Go dependencies
        run: go mod verify

      - name: Apply test database schema
        run: |
          psql "$TEST_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f migrations/001_initial_schema.up.sql

      - name: Run Go tests
        run: go test -count=1 -v ./...

      - name: Build Go API
        run: go build -o impactgraph-api .

  frontend:
    name: React Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Check linting
        run: npm run lint

      - name: Build frontend
        run: npm run build
