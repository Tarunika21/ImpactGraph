
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: impactgraph
      POSTGRES_USER: impactgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impactgraph -d impactgraph"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:17
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: impactgraph
      PGDATABASE: impactgraph
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./services/api/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        echo "Checking database schema..."
        if psql -v ON_ERROR_STOP=1 -tAc "SELECT to_regclass('public.impact_reports') IS NOT NULL" | grep -qx t; then
          echo "Existing schema detected. Skipping initial migration."
        else
          echo "Applying initial database migration..."
          psql -v ON_ERROR_STOP=1 -1 -f /migrations/001_initial_schema.up.sql
          echo "Initial migration completed."
        fi
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://impactgraph:${POSTGRES_PASSWORD}@db:5432/impactgraph?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8081"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
